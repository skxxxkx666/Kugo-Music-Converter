name: "✨ 功能建议"
description: "提出新功能、工作流改进或现有功能增强建议"
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出功能建议。请尽量描述实际使用场景，而不仅是功能名称。

  - type: textarea
    id: problem
    attributes:
      label: "你想解决什么问题？"
      description: "描述当前使用过程中遇到的不便或缺失的能力。"
      placeholder: "例如：每次转换前都要重复选择输出目录……"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "你希望怎样实现？"
      description: "描述理想的交互、功能或行为。"
      placeholder: "例如：记住上一次使用的输出目录，并允许在设置中关闭。"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: "功能类别"
      options:
        - "文件添加 / 拖放 / 文件夹扫描"
        - "本机音乐自动发现"
        - "解密 / 格式支持"
        - "转码 / 音质 / FFmpeg"
        - "输出目录 / 文件命名"
        - "元数据 / 封面"
        - "界面 / 交互"
        - "性能 / 并发"
        - "安装 / 更新"
        - "其他"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "替代方案"
      description: "目前有没有临时解决方法？没有可填写“无”。"

  - type: textarea
    id: additional
    attributes:
      label: "补充信息"
      description: "可以附上界面草图、参考项目或其他说明。"

  - type: checkboxes
    id: checklist
    attributes:
      label: "提交前确认"
      options:
        - label: "我已经搜索现有 Issues，没有发现相同或高度相似的建议。"
          required: true
